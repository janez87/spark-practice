# Spark configuration shared by master, workers, and the JupyterLab driver.
# Mounted into the containers at $SPARK_HOME/conf/spark-defaults.conf.
#
# Override per-deployment by editing .env (memory/cores) or by setting
# SPARK_DAEMON_JAVA_OPTS in the compose file.

spark.master                        spark://spark-master:7077
spark.eventLog.enabled              true
spark.eventLog.dir                  /opt/spark/work
spark.history.fs.logDirectory       /opt/spark/work
spark.serializer                    org.apache.spark.serializer.KryoSerializer
spark.sql.adaptive.enabled          true
spark.sql.adaptive.coalescePartitions.enabled true
spark.driver.host                   jupyterlab
