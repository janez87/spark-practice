name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configurationJson: |
            {
              "categories": [
                { "title": "## Breaking changes",       "labels": ["breaking"] },
                { "title": "## Features",               "labels": ["feature", "enhancement"] },
                { "title": "## Fixes",                  "labels": ["bug", "fix"] },
                { "title": "## Docs",                   "labels": ["docs"] },
                { "title": "## CI / Build",             "labels": ["ci", "build"] }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ${{ steps.notes.outputs.changelog }}

            ## Published images
            | Image                                     | Tag       |
            |-------------------------------------------|-----------|
            | `janez87/spark-practice-base`             | `${{ github.ref_name }}` |
            | `janez87/spark-practice-spark-base`       | `${{ github.ref_name }}` |
            | `janez87/spark-practice-spark-master`     | `${{ github.ref_name }}` |
            | `janez87/spark-practice-spark-worker`     | `${{ github.ref_name }}` |
            | `janez87/spark-practice-jupyterlab`       | `${{ github.ref_name }}` |

            See [`docs/upgrading.md`](docs/upgrading.md) for migration notes.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
