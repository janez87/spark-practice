name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint Dockerfiles + validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint (all Dockerfiles)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: images/**/Dockerfile
          ignore: DL3006,DL3008,DL3013,DL3018

      - name: Set up Docker Compose
        run: docker compose version

      - name: Validate compose/docker-compose.yml
        run: docker compose -f compose/docker-compose.yml config -q

      - name: Validate compose/compose.kafka.yml overlay
        run: docker compose -f compose/docker-compose.yml -f compose/compose.kafka.yml --profile kafka config -q

      - name: Validate compose/compose.hdfs.yml overlay
        run: docker compose -f compose/docker-compose.yml -f compose/compose.hdfs.yml --profile hdfs config -q

      - name: Validate compose/compose.dev.yml overlay
        run: docker compose -f compose/docker-compose.yml -f compose/compose.dev.yml config -q

  build-amd64:
    name: Build (amd64) + smoke
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base
        uses: docker/build-push-action@v5
        with:
          context: images/base
          load: true
          tags: janez87/spark-practice-base:ci
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || 'unknown' }}

      - name: Build spark-base
        uses: docker/build-push-action@v5
        with:
          context: images/spark-base
          load: true
          tags: janez87/spark-practice-spark-base:ci
          cache-from: type=gha,scope=spark-base
          cache-to: type=gha,scope=spark-base,mode=max
          build-args: |
            REGISTRY=janez87
            BASE_TAG=ci

      - name: Build spark-master
        uses: docker/build-push-action@v5
        with:
          context: images/spark-master
          load: true
          tags: janez87/spark-practice-spark-master:ci
          cache-from: type=gha,scope=spark-master
          cache-to: type=gha,scope=spark-master,mode=max
          build-args: |
            REGISTRY=janez87
            SPARK_BASE_TAG=ci

      - name: Build spark-worker
        uses: docker/build-push-action@v5
        with:
          context: images/spark-worker
          load: true
          tags: janez87/spark-practice-spark-worker:ci
          cache-from: type=gha,scope=spark-worker
          cache-to: type=gha,scope=spark-worker,mode=max
          build-args: |
            REGISTRY=janez87
            SPARK_BASE_TAG=ci

      - name: Build jupyterlab
        uses: docker/build-push-action@v5
        with:
          context: images/jupyterlab
          load: true
          tags: janez87/spark-practice-jupyterlab:ci
          cache-from: type=gha,scope=jupyterlab
          cache-to: type=gha,scope=jupyterlab,mode=max
          build-args: |
            REGISTRY=janez87
            BASE_TAG=ci

      - name: Bring up the stack
        env:
          REGISTRY: janez87
          SPARK_TAG: ci
          JUPYTERLAB_TAG: ci
          WORKERS: 1
        run: |
          docker compose -f compose/docker-compose.yml up -d
          sleep 20
          docker compose -f compose/docker-compose.yml ps

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose/docker-compose.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f compose/docker-compose.yml down -v
