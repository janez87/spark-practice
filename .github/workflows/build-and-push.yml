name: Build & Push (multi-arch)

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — refresh `latest`
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 3.5.1-1). Defaults to git tag without leading v."
        required: false

env:
  REGISTRY: janez87
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: base
            context: images/base
          - image: spark-base
            context: images/spark-base
          - image: spark-master
            context: images/spark-master
          - image: spark-worker
            context: images/spark-worker
          - image: jupyterlab
            context: images/jupyterlab
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
              echo "value=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "value=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"
          else
              echo "value=latest" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU (cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:${{ steps.tag.outputs.value }}
            ${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            REGISTRY=${{ env.REGISTRY }}
            BASE_TAG=${{ steps.tag.outputs.value }}
            SPARK_BASE_TAG=${{ steps.tag.outputs.value }}
