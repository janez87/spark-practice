name: Build & Push (multi-arch)

on:
  push:
    tags: ["v*.*.*"]
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — refresh `latest`
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 3.5.1-1). Defaults to git tag without leading v."
        required: false

env:
  REGISTRY: janez87
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
              echo "value=${{ inputs.tag }}" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "value=${GITHUB_REF#refs/tags/v}" >> "${GITHUB_OUTPUT}"
          else
              echo "value=latest" >> "${GITHUB_OUTPUT}"
          fi

  # Tier 1 — no internal deps
  build-base:
    needs: resolve-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push base
        uses: docker/build-push-action@v5
        with:
          context: images/base
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/spark-practice-base:${{ needs.resolve-tag.outputs.value }}
            ${{ env.REGISTRY }}/spark-practice-base:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/spark-practice-base:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/spark-practice-base:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

  # Tier 2 — depends on spark-practice-base
  build-tier2:
    needs: [resolve-tag, build-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spark-base
            context: images/spark-base
          - image: jupyterlab
            context: images/jupyterlab
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:${{ needs.resolve-tag.outputs.value }}
            ${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            REGISTRY=${{ env.REGISTRY }}
            BASE_TAG=${{ needs.resolve-tag.outputs.value }}

  # Tier 3 — depends on spark-practice-spark-base
  build-tier3:
    needs: [resolve-tag, build-tier2]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spark-master
            context: images/spark-master
          - image: spark-worker
            context: images/spark-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:${{ needs.resolve-tag.outputs.value }}
            ${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/spark-practice-${{ matrix.image }}:buildcache,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            REGISTRY=${{ env.REGISTRY }}
            SPARK_BASE_TAG=${{ needs.resolve-tag.outputs.value }}
